name: Aggiorna e pubblica

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      max_calls:
        description: 'Chiamate API massime (usa 700 per il caricamento dello storico)'
        default: '60'
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sincronizza storico
        env: { WU_API_KEY: '${{ secrets.WU_API_KEY }}' }
        run: node scripts/sync.mjs --max-calls=${{ github.event.inputs.max_calls || 60 }}
      - name: Salva i nuovi dati
        run: |
          git config user.name "meteo-bot"; git config user.email "meteo-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "dati: aggiornamento $(date -u +%FT%TZ)" && git push)
      - name: Build sito
        env: { WU_API_KEY: '${{ secrets.WU_API_KEY }}' }
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
